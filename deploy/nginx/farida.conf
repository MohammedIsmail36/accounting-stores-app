# Farida production frontend; the former /staging path remains explicitly retired.
# Source of truth tracked in Git; validate with `sudo nginx -t` before reload.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name farida.alibea2020.com;
    return 301 https://$server_name$request_uri;
}

# SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name farida.alibea2020.com;

    ssl_certificate /etc/letsencrypt/live/farida.alibea2020.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farida.alibea2020.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # The former Staging path is retired. Keep an explicit 404 so these URLs
    # never fall through to the Farida SPA or expose a test entry point.
    location = /staging {
        return 404;
    }

    location ^~ /staging/ {
        return 404;
    }

    # Farida production frontend.
    location / {
        root /var/www/farida;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Farida self-hosted Supabase API (port 8000).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~ /\. { deny all; }
}
